name: CI

on: [push, pull_request]

jobs:
    qualidade:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test:coverage

    e2e:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: fintrack
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fintrack
            DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fintrack
            BETTER_AUTH_SECRET: segredo-apenas-para-o-ci-1234567890
            BETTER_AUTH_URL: http://localhost:3000
            GEMINI_API_KEY: test
            NEXT_PUBLIC_DEMO_EMAIL: demo@fintrack.app
            NEXT_PUBLIC_DEMO_PASSWORD: senha-demo-do-ci
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx prisma migrate deploy
            - run: npx prisma db seed
            - run: npm run build
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
